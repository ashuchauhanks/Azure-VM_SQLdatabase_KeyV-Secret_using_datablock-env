stages:
- stage: LintAndCheckov
  displayName: tflint sec checkov
  jobs:
  - job: LintAndCheckovJob
    displayName: Terraform Lint And Checkov
    continueOnError: true
    steps: 


    - task: PowerShell@2
      displayName: tflint
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          cd $(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root
          tflint --init
          tflint

    - task: PowerShell@2
      displayName: checkov
      continueOnError: true
      inputs:
        targetType: 'inline'
        script: |
          $env:HOME = "$env:USERPROFILE"
          cd $(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root
          checkov -d . --framework terraform

    - task: AzureCLI@2
      displayName: TFSEC
      continueOnError: true
      inputs:
        azureSubscription: "ashu-Service-connection"
        scriptType: ps
        scriptLocation: inlineScript
        inlineScript: |
          cd $(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root
          tfsec

- stage: Validate
  dependsOn: LintAndCheckov
  displayName: Terraform Validate
  jobs:
  - job: TerraformValidate
    displayName: Terraform Validate
    continueOnError: true
    steps:

    - task: TerraformTask@5
      displayName: TerraformInit
      continueOnError: true
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'
        backendServiceArm: 'ashu-Service-connection'
        backendAzureRmResourceGroupName: 'rg-bknd-ashu'
        backendAzureRmStorageAccountName: 'stgbkendpipelineashu'
        backendAzureRmContainerName: 'tfcontainer'
        backendAzureRmKey: 'root.tfstate'
    - task: TerraformTask@5
      displayName: terraform validate
      continueOnError: true
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'


- stage: plan
  dependsOn: 
  - LintAndCheckov
  - Validate
  displayName: Terraform plan infra cost
  jobs:
  - job: terraformPlan
    continueOnError: true
    displayName: Terraform infra cost
    steps: 
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'
        backendServiceArm: 'ashu-Service-connection'
        backendAzureRmResourceGroupName: 'rg-bknd-ashu'
        backendAzureRmStorageAccountName: 'stgbkendpipelineashu'
        backendAzureRmContainerName: 'tfcontainer'
        backendAzureRmKey: 'root.tfstate'

    - task: TerraformTask@5
      continueOnError: true
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'
        environmentServiceNameAzureRM: 'ashu-Service-connection'

    - task: InfracostSetup@2
      inputs:
        apiKey: 'ico-qbgidTFYPSyYajjiobnp8QywUx08BGMO'
        version: '0.10.x'
        currency: 'INR'

    - task: CmdLine@2
      inputs:
        script: |
          cd $(System.DefaultWorkingDirectory)\Azure-VM_SQLdatabase_KeyV-Secret_using_datablock\root
          infracost breakdown --path . --format table


- stage: ManualValidation
  displayName: Manual Validation Check
  dependsOn: plan
  jobs:
  - job: ManualValidationJob
    pool: server
    steps:
    - task: ManualValidation@1
      displayName: ManualValidation
      inputs:
        approvers: 'ashuchauhanks@gmail.com'
        instructions: 'pls check and approve, if valid'


- stage: Apply
  displayName: Terraform Apply
  dependsOn: ManualValidation
  jobs:
  - job: Apply
    displayName: Terraform apply
    steps:
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'
        backendServiceArm: 'ashu-Service-connection'
        backendAzureRmResourceGroupName: 'rg-bknd-ashu'
        backendAzureRmStorageAccountName: 'stgbkendpipelineashu'
        backendAzureRmContainerName: 'tfcontainer'
        backendAzureRmKey: 'root.tfstate'

    - task: TerraformTask@5
      displayName: Terraform apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/Azure-VM_SQLdatabase_KeyV-Secret_using_datablock/root'
        # commandOptions: '-auto-approve'
        environmentServiceNameAzureRM: 'ashu-Service-connection'
